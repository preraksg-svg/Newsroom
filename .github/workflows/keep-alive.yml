name: Keep Alive Zapway Newsroom

# Redundant/backup keep-alive. PRIMARY keep-alive is UptimeRobot (5-min HTTP
# monitor). This GitHub Actions cron is a second, independent pinger so a single
# keep-alive outage can't let the free Render service sleep. Note: GitHub cron is
# best-effort (runs can be delayed) and the schedule auto-disables after 60 days
# of repo inactivity, so it is a backup to UptimeRobot, not a replacement.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render App
        env:
          # Override the live URL by setting repo variable APP_URL (or RENDER_URL)
          # under Settings -> Secrets and variables -> Actions -> Variables.
          # Falls back to the known production URL below if neither is set.
          APP_URL: ${{ vars.APP_URL }}
          RENDER_URL: ${{ vars.RENDER_URL }}
        run: |
          URL="${APP_URL:-${RENDER_URL:-https://newsroom-1zapway-newsroom-cloud.onrender.com}}"
          echo "Pinging $URL/api/analytics"
          curl -sS -m 90 --retry 4 --retry-delay 15 "$URL/api/analytics" -o /dev/null -w "HTTP %{http_code}\n" || true
